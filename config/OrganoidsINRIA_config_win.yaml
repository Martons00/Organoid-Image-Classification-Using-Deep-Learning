
# BRATS Swin UNETR Segmentation Configuration
SYSTEM:
  seed: 304
  distributed: false
  world_size: 1
  rank: 0
  dist_url: "tcp://127.0.0.1:23456"
  dist_backend: "nccl"
  workers: 1
  output_dir: "outputs/"
  logs_dir: "logs/"
  telegram_log: false

MODEL:
  name: "swinunetr"
  pretrained_model_name: "model.pt"
  pretrained_dir: "./pretrained_models/fold1_f48_ep300_4gpu_dice0_9059/"
  checkpoint: null
  resume_ckpt: false
  feature_size: 48
  in_channels: 4
  out_channels: 3
  spatial_dims: 3
  norm_name: "instance"
  dropout_rate: 0.0
  dropout_path_rate: 0.0
  use_checkpoint: false

DATASET:
  name: "OrganoidsINRIA"
  data_dir: "F:/Organoids/Organoids_Dataset"
  exact_class: true
  ignore_label: 3
  fold: 0
  cache_dataset: false
  # ROI size
  roi_x: 64
  roi_y: 64
  roi_z: 64

AUGMENTATION:
  RandFlipd_prob: 0.2
  RandRotate90d_prob: 0.2
  RandScaleIntensityd_prob: 0.1
  RandShiftIntensityd_prob: 0.1

TRAINING:
  max_epochs: 3
  batch_size: 1
  sw_batch_size: 1
  val_every: 1
  debug: true
  debug_train_samples: 6
  debug_val_samples: 6
  split_method: "balanced"  # "random" or "stratified
  save_checkpoint: false
  noamp: false
  # Optimizer parameters
  optim_lr: 0.0001
  optim_name: "adamw"
  reg_weight: 0.00001
  momentum: 0.99
  # Learning rate scheduler
  lrschedule: ""
  warmup_epochs: 50

LOSS:
  weight: 0.5

INFERENCE:
  infer_overlap: 0.5

LOGGING:
  logdir: "test"
